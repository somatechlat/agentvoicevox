# ==========================================================================
# AGENTVOICEBOX APPLICATION STACK - STANDALONE (7GB RAM Budget)
# ==========================================================================
# Project: agentvoicebox
#
# ⚠️  PORT POLICY - 65000-65099 ONLY ⚠️
# ==========================================================================

version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # ==========================================================================
  # INFRASTRUCTURE: Postgres & Redis
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: avb-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: agentvoicebox
      POSTGRES_USER: shared_admin
      POSTGRES_PASSWORD: shared_secure_2024
    ports:
      - "65004:5432"
    volumes:
      - avb_postgres_data:/var/lib/postgresql/data
    networks:
      - avb-network
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shared_admin -d agentvoicebox"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: avb-redis
    hostname: redis
    ports:
      - "65005:6379"
    volumes:
      - avb_redis_data:/data
    networks:
      - avb-network
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # DJANGO API GATEWAY (1.5GB)
  # ==========================================================================
  django-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avb-django-api
    hostname: django-api
    ports:
      - "65020:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: dev-secret-key-for-local-development-only
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      # Local PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: agentvoicebox
      DB_USER: shared_admin
      DB_PASSWORD: shared_secure_2024
      DB_CONN_MAX_AGE: 60
      # Local Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_DB: 1
      REDIS_SESSION_DB: 2
      REDIS_CHANNEL_DB: 3
      # Disable Keycloak locally
      AUTH_BYPASS: "true"
      # OVOS Bus Configuration
      OVOS_BUS_HOST: ovos-bus
      OVOS_BUS_PORT: 8181
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 768M
    networks:
      - avb-network
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================
  # PORTAL FRONTEND - Lit 3 / Vite (512MB)
  # ==========================================================================
  portal-frontend:
    build:
      context: ./portal-frontend
      dockerfile: Dockerfile
    container_name: avb-portal-frontend
    hostname: portal-frontend
    ports:
      - "65027:65027"
    environment:
      VITE_API_URL: http://localhost:65020
      VITE_AUTH_BYPASS: "true"
    depends_on:
      - django-api
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - avb-network
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================
  # OVOS MESSAGE BUS - Intelligence Backbone (128MB)
  # ==========================================================================
  ovos-bus:
    image: smartgic/ovos-messagebus:latest
    container_name: avb-ovos-bus
    hostname: ovos-bus
    ports:
      - "65081:8181"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - avb-network
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================
  # OVOS CORE - Intent Engine (512MB)
  # ==========================================================================
  ovos-core:
    image: smartgic/ovos-core:latest
    container_name: avb-ovos-core
    hostname: ovos-core
    environment:
      BUS_HOST: ovos-bus
    depends_on:
      - ovos-bus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - avb-network
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================
  # OVOS LISTENER - STT (512MB)
  # ==========================================================================
  ovos-listener:
    image: smartgic/ovos-listener:latest
    container_name: avb-ovos-listener
    hostname: ovos-listener
    environment:
      BUS_HOST: ovos-bus
    depends_on:
      - ovos-bus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - avb-network
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================
  # OVOS AUDIO - TTS / Playback Routing (512MB)
  # ==========================================================================
  ovos-audio:
    image: smartgic/ovos-audio:latest
    container_name: avb-ovos-audio
    hostname: ovos-audio
    environment:
      BUS_HOST: ovos-bus
    depends_on:
      - ovos-bus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - avb-network
    logging: *default-logging
    restart: unless-stopped

networks:
  avb-network:
    name: avb_internal_network

volumes:
  avb_postgres_data:
  avb_redis_data:
