# ==========================================================================
# AGENTVOICEBOX APPLICATION STACK (7GB RAM Budget)
# ==========================================================================
# Project: agentvoicebox
#
# This stack USES shared infrastructure (PostgreSQL, Redis, Keycloak, Vault)
# running on the shared_services_network.
#
# ⚠️  CRITICAL: Start shared-services FIRST!
# Run: cd shared-services && docker compose -p shared-services up -d
#
# ⚠️  PORT POLICY - 65000-65099 ONLY ⚠️
# ==========================================================================
#
# RAM Budget (AgentVoiceBox Services - 7GB Total):
#   Django API:        1.5GB
#   Portal Frontend:   512MB
#   Workers (LLM):     2GB (for large context windows)
#   Workers (STT):     1.5GB (for Whisper models)
#   Workers (TTS):     1GB (for Kokoro)
#   Buffer:            ~512MB
#
# TOTAL: Shared (8GB) + AgentVoiceBox (7GB) = 15GB
# ==========================================================================

version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  # ==========================================================================
  # DJANGO API GATEWAY (1.5GB)
  # ==========================================================================
  django-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avb-django-api
    hostname: django-api
    ports:
      - "65020:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: dev-secret-key-for-local-development-only
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      # Shared PostgreSQL (65004 internal, postgres hostname on shared network)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: agentvoicebox
      DB_USER: shared_admin
      DB_PASSWORD: shared_secure_2024
      DB_CONN_MAX_AGE: 60
      # Shared Redis (65005 internal)
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_DB: 1
      REDIS_SESSION_DB: 2
      REDIS_CHANNEL_DB: 3
      # Shared Keycloak (65006 internal)
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: agentvoicebox
      KEYCLOAK_CLIENT_ID: agentvoicebox-api
      KEYCLOAK_CLIENT_SECRET: dev-secret-12345
      # Shared Vault (65003 internal)
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: devtoken
      # Shared Temporal (65007 internal)
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: agentvoicebox
      # OVOS Bus Configuration
      OVOS_BUS_HOST: ovos-bus
      OVOS_BUS_PORT: 8181
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 768M
    networks:
      - shared-network
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1" ]

  # ==========================================================================
  # PORTAL FRONTEND - Lit 3 / Vite (512MB)
  # ==========================================================================
  portal-frontend:
    build:
      context: ./portal-frontend
      dockerfile: Dockerfile
    container_name: avb-portal-frontend
    hostname: portal-frontend
    ports:
      - "65027:65027"
    environment:
      # External URLs (how browser sees them via localhost)
      VITE_API_URL: http://localhost:65020
      VITE_KEYCLOAK_URL: http://localhost:65006
      VITE_KEYCLOAK_REALM: agentvoicebox
      VITE_KEYCLOAK_CLIENT_ID: portal-frontend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - shared-network
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD-SHELL", "curl -f http://localhost:65027/ || exit 1" ]

  # ==========================================================================
  # PROMETHEUS (512MB)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: avb-prometheus
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "65011:9090"
    volumes:
      - ./backend/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/prometheus/alerts:/etc/prometheus/alerts:ro
      - avb_prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - shared-network
    logging: *default-logging
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy" ]



  # ==========================================================================
  # OVOS MESSAGE BUS - Intelligence Backbone (128MB)
  # ==========================================================================
  ovos-bus:
    image: smartgic/ovos-messagebus:latest
    container_name: avb-ovos-bus
    hostname: ovos-bus
    ports:
      - "65081:8181"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - shared-network
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================
  # OVOS CORE - Intent Engine (512MB)
  # ==========================================================================
  ovos-core:
    image: smartgic/ovos-core:latest
    container_name: avb-ovos-core
    hostname: ovos-core
    environment:
      BUS_HOST: ovos-bus
    depends_on:
      - ovos-bus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - shared-network
    logging: *default-logging
    restart: unless-stopped

# ==========================================================================
# SHARED NETWORK (Connects to shared-services)
# ==========================================================================
networks:
  shared-network:
    name: shared_services_network
    external: true

volumes:
  avb_prometheus_data:
